<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:*">
    <title>Document</title>
    <link rel="stylesheet" href="popup/popup-base.css">
    <link rel="stylesheet" href="popup/popup-chat.css">
    <link rel="stylesheet" href="popup/popup-input.css">
    <link rel="stylesheet" href="popup/popup-views.css">
    <link rel="stylesheet" href="github.min.css">
    <script src="marked.min.js"></script>
    <script src="highlight.min.js"></script>
</head>

<body>
    <h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Chrome
        extension sidebar with chat panel and navigation</h2>

    <div class="sidebar-shell">
        <div class="main-panel">
            <div class="header">
                <div class="header-left">
                    <span class="header-title">New Chat</span>
                </div>
                <div class="header-actions">
                    <!-- 1. New Chat (Square Pen) -->
                    <button class="icon-btn" aria-label="New chat" data-tooltip="New chat">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M9 7h-3a2 2 0 0 0 -2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2 -2v-3" />
                            <path d="M9 15h3l8.5 -8.5a1.5 1.5 0 0 0 -3 -3l-8.5 8.5v3" />
                            <path d="M16 5l3 3" />
                        </svg>
                    </button>

                    <!-- 2. Export (External Link) -->
                    <button class="icon-btn" aria-label="Export" data-tooltip="Export">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 6h-6a2 2 0 0 0 -2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-6" />
                            <path d="M11 13l9 -9" stroke-linecap="round" />
                            <path d="M15 4h5v5" />
                        </svg>
                    </button>

                    <!-- 3. Toggle Sidebar (Left Sidebar Collapse) -->
                    <button class="icon-btn" aria-label="Toggle sidebar" data-tooltip="Hide sidebar"
                        data-tooltip-side="bottom-left">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="4" y="4" width="16" height="16" rx="2" />
                            <path d="M9 4v16" />
                            <path d="M14 10l-2 2l2 2" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="chat-view" id="chatView">
                <div class="chat-area"></div>

                <div class="input-area">
                    <div class="input-box-wrapper">
                        <textarea class="input-box" placeholder="Ask anything..."></textarea>
                        <input id="attachmentInput" class="attachment-input" type="file" multiple
                            accept=".pdf,.docx,.pptx,.png,.jpg,.jpeg,.gif,.webp,.bmp,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.presentationml.presentation,image/png,image/jpeg,image/gif,image/webp,image/bmp,image/x-ms-bmp"
                            hidden>
                        <div class="attachment-tray" id="attachmentTray" aria-live="polite" hidden></div>
                        <div class="attachment-error" id="attachmentError" hidden></div>
                        <div class="input-footer">
                            <div class="model-selector-wrapper" style="position: relative;">
                                <button class="model-selector" id="modelSelectBtn">
                                    <div class="model-dot"></div>
                                    <span id="selectedModelText">Gemini 3.1 Flash-Lite</span>
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="font-size:13px; width: 14px; height: 14px;"><polyline points="6 9 12 15 18 9"></polyline></svg>
                                </button>
                                <div class="model-dropdown" id="modelDropdown"
                                    style="display: none; position: absolute; bottom: 100%; left: 0; margin-bottom: 8px; background: #fff; border: 1px solid rgba(0,0,0,0.08); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); padding: 6px; z-index: 100; min-width: 190px; font-family: 'Inter', sans-serif;">
                                    <div class="model-option" data-model="gemini-2.5-flash"
                                        style="padding: 10px 12px; cursor: pointer; border-radius: 8px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; color: #111;">
                                        <div class="model-dot" style="background: #4b3fd8;"></div>Gemini 2.5 Flash
                                    </div>
                                    <div class="model-option" data-model="gemini-3.1-flash-lite"
                                        style="padding: 10px 12px; cursor: pointer; border-radius: 8px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; color: #111;">
                                        <div class="model-dot" style="background: #8b5cf6;"></div>Gemini 3.1 Flash-Lite
                                    </div>
                                    <div class="model-option" data-model="gemini-2.5-flash-lite"
                                        style="padding: 10px 12px; cursor: pointer; border-radius: 8px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; color: #111;">
                                        <div class="model-dot" style="background: #10b981;"></div>Gemini 2.5 Flash-Lite
                                    </div>
                                </div>
                            </div>
                            <div class="input-right">
                                <button class="plus-btn" aria-label="Attach" type="button">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                        stroke-linejoin="round" aria-hidden="true" style="width: 18px !important; height: 18px !important;">
                                        <line x1="12" y1="5" x2="12" y2="19" />
                                        <line x1="5" y1="12" x2="19" y2="12" />
                                    </svg>
                                </button>
                                <button class="send-btn" aria-label="Send" type="button">
                                    <svg class="send-btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                        stroke-linejoin="round" aria-hidden="true" style="width: 18px !important; height: 18px !important;">
                                        <line x1="12" y1="19" x2="12" y2="5" />
                                        <polyline points="5 12 12 5 19 12" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="discover-view" id="discoverView" hidden>
                <div class="discover-header">
                    <h2>Discover</h2>
                    <p>Jump-start a conversation with a ready-made prompt.</p>
                </div>
                <div class="discover-grid">
                    <button class="discover-card" data-prompt="Summarize this document for me in 3 bullet points.">
                        <div class="discover-card-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M5 12v-7a2 2 0 0 1 2-2h7l5 5v4"/><path d="M5 21v-6h1.5a1.5 1.5 0 0 1 0 3h-1.5"/></svg>
                        </div>
                        <span class="discover-card-title">Summarize</span>
                        <span class="discover-card-desc">Condense a document or article</span>
                    </button>

                    <button class="discover-card" data-prompt="Write a short, professional email about: ">
                        <div class="discover-card-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
                        </div>
                        <span class="discover-card-title">Write</span>
                        <span class="discover-card-desc">Draft an email or message</span>
                    </button>

                    <button class="discover-card" data-prompt="Review this code and suggest improvements: ">
                        <div class="discover-card-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                        </div>
                        <span class="discover-card-title">Code</span>
                        <span class="discover-card-desc">Review or debug a snippet</span>
                    </button>

                    <button class="discover-card" data-prompt="Brainstorm 5 ideas for: ">
                        <div class="discover-card-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>
                        </div>
                        <span class="discover-card-title">Brainstorm</span>
                        <span class="discover-card-desc">Generate ideas on a topic</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="right-nav">
            <!-- 1. Chat (Active) -->
            <div class="nav-item active" role="button" tabindex="0" data-nav-item="chat">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3a9 9 0 0 1 9 9a9 9 0 0 1-9 9a9 9 0 0 1-2.5-.35L4 21l1.35-5.5A9 9 0 0 1 12 3z" />
                </svg>
                <span class="nav-label">Chat</span>
            </div>

            <!-- 2. Discover -->
            <div class="nav-item" role="button" tabindex="0" data-nav-item="discover">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="9" />
                    <path d="M10 14l4-4" />
                    <path d="M14 10l-2.5 5.5L10 14l5.5-2.5z" />
                </svg>
                <span class="nav-label">Discover</span>
            </div>

            <!-- 3. Agents -->
            <div class="nav-item" role="button" tabindex="0" data-nav-item="agents">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 2v4" />
                    <path d="M9 4h6" />
                    <rect x="5" y="8" width="14" height="10" rx="2" />
                    <path d="M9 13h.01M15 13h.01" />
                    <path d="M8 18v2M16 18v2" />
                    <path d="M5 13H3M19 13h2" />
                </svg>
                <span class="nav-label">Agents</span>
            </div>

            <!-- 4. Knowledge -->
            <div class="nav-item" role="button" tabindex="0" data-nav-item="knowledge">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z" />
                    <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z" />
                    <path d="M12 5v14" />
                </svg>
                <span class="nav-label">Knowledge</span>
            </div>

            <!-- 5. Templates -->
            <div class="nav-item" role="button" tabindex="0" data-nav-item="templates">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="4" y="4" width="16" height="4" rx="1" />
                    <rect x="4" y="12" width="6" height="8" rx="1" />
                    <line x1="14" y1="12" x2="20" y2="12" />
                    <line x1="14" y1="16" x2="20" y2="16" />
                    <line x1="14" y1="20" x2="20" y2="20" />
                </svg>
                <span class="nav-label">Templates</span>
            </div>

            <!-- 6. Activity -->
            <div class="nav-item" role="button" tabindex="0" data-nav-item="activity">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 12h4.5l1.5-6l3 12l1.5-6h4.5" />
                </svg>
                <span class="nav-label">Activity</span>
            </div>

            <!-- 7. Settings -->
            <div class="nav-item" role="button" tabindex="0" data-nav-item="settings">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 0 0-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 0 0-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 0 0-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 0 0-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 0 0 1.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <circle cx="12" cy="12" r="3" />
                </svg>
                <span class="nav-label">Settings</span>
            </div>

            <div class="nav-spacer"></div>
            <div class="nav-divider"></div>

            <div class="nav-item" role="button" tabindex="0" data-nav-item="help">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                    <line x1="12" y1="17" x2="12.01" y2="17" />
                </svg>
                <span class="nav-label">Help</span>
            </div>

            <div class="avatar" role="button" tabindex="0" aria-label="User profile">
                N
                <div class="avatar-dot"></div>
            </div>
        </div>
    </div>

    <template id="emptyStateTemplate">
        <div class="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="120" height="120">
                <defs>
                    <filter id="sider-glow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur in="SourceGraphic" stdDeviation="12"></feGaussianBlur>
                    </filter>

                    <radialGradient id="sider-base" cx="20%" cy="20%" r="90%" fx="20%" fy="20%">
                        <stop offset="0%" stop-color="#c4cbff"></stop>
                        <stop offset="35%" stop-color="#83a1ff"></stop>
                        <stop offset="70%" stop-color="#4b3fd8"></stop>
                        <stop offset="100%" stop-color="#1a1670"></stop>
                    </radialGradient>

                    <radialGradient id="sider-specular" cx="32%" cy="22%" r="40%" fx="32%" fy="22%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"></stop>
                        <stop offset="20%" stop-color="#ffffff" stop-opacity="0.3"></stop>
                        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"></stop>
                    </radialGradient>

                    <radialGradient id="sider-bounce" cx="80%" cy="70%" r="60%" fx="80%" fy="70%">
                        <stop offset="0%" stop-color="#a2d8ff" stop-opacity="0.8"></stop>
                        <stop offset="50%" stop-color="#6073ea" stop-opacity="0.4"></stop>
                        <stop offset="100%" stop-color="#4b3fd8" stop-opacity="0"></stop>
                    </radialGradient>
                </defs>

                <circle cx="64" cy="68" r="32" fill="#6073ea" filter="url(#sider-glow)" opacity="0.6">
                    <animate attributeName="opacity" values="0.4; 0.8; 0.4" dur="4s" repeatCount="indefinite" />
                </circle>

                <circle cx="64" cy="64" r="36" fill="url(#sider-base)">
                    <animateTransform attributeName="transform" type="rotate" from="0 64 64" to="360 64 64" dur="10s"
                        repeatCount="indefinite" />
                </circle>

                <circle cx="64" cy="64" r="36" fill="url(#sider-bounce)">
                    <animateTransform attributeName="transform" type="rotate" from="360 64 64" to="0 64 64" dur="14s"
                        repeatCount="indefinite" />
                </circle>

                <circle cx="64" cy="64" r="36" fill="url(#sider-specular)"></circle>
            </svg>

            <span>Start a new conversation</span>
        </div>
    </template>

    <script src="js/main.js" type="module"></script>
</body>

</html>
