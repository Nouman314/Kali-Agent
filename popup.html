<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="popup.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Chrome
        extension sidebar with chat panel and navigation</h2>

    <div class="sidebar-shell">
        <div class="main-panel">
            <div class="header">
                <div class="header-left">
                    <span class="header-title">New Chat</span>
                    <i class="ti ti-chevron-down header-chevron" aria-hidden="true"></i>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" aria-label="New chat"><i class="ti ti-edit"
                            aria-hidden="true"></i></button>
                    <button class="icon-btn" aria-label="Export"><i class="ti ti-external-link"
                            aria-hidden="true"></i></button>
                    <button class="icon-btn" aria-label="Close"><i class="ti ti-x" aria-hidden="true"></i></button>
                </div>
            </div>

            <div class="chat-area">
                <div class="empty-state">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="120" height="120">
                        <defs>
                            <filter id="sider-glow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur in="SourceGraphic" stdDeviation="12"></feGaussianBlur>
                            </filter>

                            <radialGradient id="sider-base" cx="20%" cy="20%" r="90%" fx="20%" fy="20%">
                            <stop offset="0%" stop-color="#c4cbff"></stop>
                            <stop offset="35%" stop-color="#83a1ff"></stop>
                            <stop offset="70%" stop-color="#4b3fd8"></stop>
                            <stop offset="100%" stop-color="#1a1670"></stop>
                            </radialGradient>

                            <radialGradient id="sider-specular" cx="32%" cy="22%" r="40%" fx="32%" fy="22%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"></stop>
                            <stop offset="20%" stop-color="#ffffff" stop-opacity="0.3"></stop>
                            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"></stop>
                            </radialGradient>

                            <radialGradient id="sider-bounce" cx="80%" cy="70%" r="60%" fx="80%" fy="70%">
                            <stop offset="0%" stop-color="#a2d8ff" stop-opacity="0.8"></stop>
                            <stop offset="50%" stop-color="#6073ea" stop-opacity="0.4"></stop>
                            <stop offset="100%" stop-color="#4b3fd8" stop-opacity="0"></stop>
                            </radialGradient>
                        </defs>

                        <circle cx="64" cy="68" r="32" fill="#6073ea" filter="url(#sider-glow)" opacity="0.6">
                            <animate attributeName="opacity" values="0.4; 0.8; 0.4" dur="4s" repeatCount="indefinite" />
                        </circle>

                        <circle cx="64" cy="64" r="36" fill="url(#sider-base)">
                            <animateTransform attributeName="transform" type="rotate" from="0 64 64" to="360 64 64" dur="10s" repeatCount="indefinite" />
                        </circle>

                        <circle cx="64" cy="64" r="36" fill="url(#sider-bounce)">
                            <animateTransform attributeName="transform" type="rotate" from="360 64 64" to="0 64 64" dur="14s" repeatCount="indefinite" />
                        </circle>

                        <circle cx="64" cy="64" r="36" fill="url(#sider-specular)"></circle>
                    </svg>

                    <span>Start a new conversation</span>
                </div>
            </div>

            <div class="input-area">
                <div class="input-box-wrapper">
                    <textarea class="input-box" placeholder="Ask anything..."></textarea>
                    <div class="input-footer">
                        <div class="model-selector-wrapper" style="position: relative;">
                            <button class="model-selector" id="modelSelectBtn">
                                <div class="model-dot"></div>
                                <span id="selectedModelText">Gemini 2.5 Flash</span>
                                <i class="ti ti-chevron-down" aria-hidden="true" style="font-size:13px;"></i>
                            </button>
                            <div class="model-dropdown" id="modelDropdown" style="display: none; position: absolute; bottom: 100%; left: 0; margin-bottom: 8px; background: #fff; border: 1px solid rgba(0,0,0,0.08); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); padding: 6px; z-index: 100; min-width: 170px; font-family: 'Inter', sans-serif;">
                                <div class="model-option" data-model="gemini-2.5-flash" style="padding: 10px 12px; cursor: pointer; border-radius: 8px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; color: #111;">
                                    <div class="model-dot" style="background: #4b3fd8;"></div>Gemini 2.5 Flash
                                </div>
                                <div class="model-option" data-model="gemini-2.0-flash" style="padding: 10px 12px; cursor: pointer; border-radius: 8px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; color: #111;">
                                    <div class="model-dot" style="background: #6073ea;"></div>Gemini 2.0 Flash
                                </div>
                                <div class="model-option" data-model="gemini-1.5-flash" style="padding: 10px 12px; cursor: pointer; border-radius: 8px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; color: #111;">
                                    <div class="model-dot" style="background: #83a1ff;"></div>Gemini 1.5 Flash
                                </div>
                            </div>
                        </div>
                        <div class="input-right">
                            <button class="plus-btn" aria-label="Attach"><i class="ti ti-plus"
                                    aria-hidden="true"></i></button>
                            <button class="send-btn" aria-label="Send"><i class="ti ti-arrow-up"
                                    aria-hidden="true"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="right-nav">
            <div class="nav-item active" role="button" tabindex="0">
                <i class="ti ti-message-circle" aria-hidden="true"></i>
                <span class="nav-label">Chat</span>
            </div>
            <div class="nav-item" role="button" tabindex="0">
                <i class="ti ti-compass" aria-hidden="true"></i>
                <span class="nav-label">Discover</span>
            </div>
            <div class="nav-item" role="button" tabindex="0">
                <i class="ti ti-robot" aria-hidden="true"></i>
                <span class="nav-label">Agents</span>
            </div>
            <div class="nav-item" role="button" tabindex="0">
                <i class="ti ti-brain" aria-hidden="true"></i>
                <span class="nav-label">Knowledge</span>
            </div>
            <div class="nav-item" role="button" tabindex="0">
                <i class="ti ti-template" aria-hidden="true"></i>
                <span class="nav-label">Templates</span>
            </div>
            <div class="nav-item" role="button" tabindex="0">
                <i class="ti ti-activity" aria-hidden="true"></i>
                <span class="nav-label">Activity</span>
            </div>
            <div class="nav-item" role="button" tabindex="0">
                <i class="ti ti-settings" aria-hidden="true"></i>
                <span class="nav-label">Settings</span>
            </div>

            <div class="nav-spacer"></div>
            <div class="nav-divider"></div>

            <div class="nav-item" role="button" tabindex="0">
                <i class="ti ti-help-circle" aria-hidden="true"></i>
                <span class="nav-label">Help</span>
            </div>

            <div class="avatar" role="button" tabindex="0" aria-label="User profile">
                N
                <div class="avatar-dot"></div>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
