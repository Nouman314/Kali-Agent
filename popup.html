<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="popup.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Chrome
        extension sidebar with chat panel and navigation</h2>

    <div class="sidebar-shell">
        <div class="main-panel">
            <div class="header">
                <div class="header-left">
                    <span class="header-title">New Chat</span>
                    <i class="ti ti-chevron-down header-chevron" aria-hidden="true"></i>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" aria-label="New chat"><i class="ti ti-edit"
                            aria-hidden="true"></i></button>
                    <button class="icon-btn" aria-label="Export"><i class="ti ti-external-link"
                            aria-hidden="true"></i></button>
                    <button class="icon-btn" aria-label="Close"><i class="ti ti-x" aria-hidden="true"></i></button>
                </div>
            </div>

            <div class="chat-area">
                <div class="empty-state">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="120" height="120">
                      <defs>
                        <filter id="sider-glow" x="-50%" y="-50%" width="200%" height="200%">
                          <feGaussianBlur in="SourceGraphic" stdDeviation="12" />
                        </filter>

                        <radialGradient id="sider-base" cx="30%" cy="30%" r="70%" fx="30%" fy="30%">
                          <stop offset="0%" stop-color="#f0abfc" />
                          <stop offset="35%" stop-color="#c084fc" />
                          <stop offset="75%" stop-color="#7e22ce" />
                          <stop offset="100%" stop-color="#4c1d95" />
                        </radialGradient>

                        <radialGradient id="sider-specular" cx="32%" cy="22%" r="40%" fx="32%" fy="22%">
                          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
                          <stop offset="20%" stop-color="#ffffff" stop-opacity="0.3" />
                          <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
                        </radialGradient>

                        <radialGradient id="sider-bounce" cx="70%" cy="80%" r="50%" fx="70%" fy="80%">
                          <stop offset="0%" stop-color="#e879f9" stop-opacity="0.6" />
                          <stop offset="100%" stop-color="#e879f9" stop-opacity="0" />
                        </radialGradient>
                      </defs>

                      <circle cx="64" cy="68" r="32" fill="#a855f7" filter="url(#sider-glow)" opacity="0.6" />

                      <circle cx="64" cy="64" r="36" fill="url(#sider-base)" />

                      <circle cx="64" cy="64" r="36" fill="url(#sider-bounce)" />
                      <circle cx="64" cy="64" r="36" fill="url(#sider-specular)" />
                    </svg>
                    <span>Start a new conversation</span>
                </div>
            </div>

            <div class="input-area">
                <textarea class="input-box" placeholder="Ask anything..."></textarea>
                <div class="input-footer">
                    <button class="model-selector">
                        <div class="model-dot"></div>
                        <span>Opus 4.5</span>
                        <i class="ti ti-chevron-down" aria-hidden="true" style="font-size:13px;"></i>
                    </button>
                    <div class="input-right">
                        <button class="plus-btn" aria-label="Attach"><i class="ti ti-plus"
                                aria-hidden="true"></i></button>
                        <button class="send-btn" aria-label="Send"><i class="ti ti-arrow-up"
                                aria-hidden="true"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <div class="right-nav">
            <div class="nav-item active" role="button" tabindex="0">
                <i class="ti ti-message-circle" aria-hidden="true"></i>
                <span class="nav-label">Chat</span>
            </div>
            <div class="nav-item" role="button" tabindex="0">
                <i class="ti ti-compass" aria-hidden="true"></i>
                <span class="nav-label">Discover</span>
            </div>
            <div class="nav-item" role="button" tabindex="0">
                <i class="ti ti-robot" aria-hidden="true"></i>
                <span class="nav-label">Agents</span>
            </div>
            <div class="nav-item" role="button" tabindex="0">
                <i class="ti ti-brain" aria-hidden="true"></i>
                <span class="nav-label">Knowledge</span>
            </div>
            <div class="nav-item" role="button" tabindex="0">
                <i class="ti ti-template" aria-hidden="true"></i>
                <span class="nav-label">Templates</span>
            </div>
            <div class="nav-item" role="button" tabindex="0">
                <i class="ti ti-activity" aria-hidden="true"></i>
                <span class="nav-label">Activity</span>
            </div>
            <div class="nav-item" role="button" tabindex="0">
                <i class="ti ti-settings" aria-hidden="true"></i>
                <span class="nav-label">Settings</span>
            </div>

            <div class="nav-spacer"></div>
            <div class="nav-divider"></div>

            <div class="nav-item" role="button" tabindex="0">
                <i class="ti ti-help-circle" aria-hidden="true"></i>
                <span class="nav-label">Help</span>
            </div>

            <div class="avatar" role="button" tabindex="0" aria-label="User profile">
                N
                <div class="avatar-dot"></div>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
